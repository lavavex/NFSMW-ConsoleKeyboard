# Builds the plugin on every push and pull request. A version tag (v*), or running this
# workflow by hand with a version, also publishes it as a release (the tag is made at the
# commit built) with SHA256SUMS. The build repeats: the same compiler gives the same bytes, so
# anyone can check a release against this source with the image and package named in its
# notes.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release to publish (a new tag, e.g. v1.1)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 (i686)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-i686 zip

      - name: Build
        run: |
          make dist
          {
            sha256sum NFSMWConsoleKeyboard.asi NFSMWConsoleKeyboard.zip
          } > SHA256SUMS
          {
            echo "Built by GitHub Actions on ${ImageOS:-ubuntu-24.04} ${ImageVersion:-}"
            echo "Compiler: $(i686-w64-mingw32-gcc --version | head -1)"
            echo "Package: gcc-mingw-w64-i686 $(dpkg-query -W -f='${Version}' gcc-mingw-w64-i686)"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > build-notes.md
          cat build-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: NFSMWConsoleKeyboard
          path: |
            NFSMWConsoleKeyboard.asi
            NFSMWConsoleKeyboard.zip
            SHA256SUMS
            build-notes.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          [[ $VERSION =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "not a version: $VERSION" >&2; exit 1; }
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
            --notes-file build-notes.md NFSMWConsoleKeyboard.zip NFSMWConsoleKeyboard.asi SHA256SUMS
